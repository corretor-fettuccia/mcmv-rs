name: 02 make-feed-merchantcenter - XML Google

'on':
  workflow_call:
    inputs:
      encadeado:
        type: boolean
        default: false
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gerar:
    name: 02 - XML Merchant Center
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código do Git
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Receber catalogo.json produzido pelo sinc-data do Core
        if: ${{ inputs.encadeado == true }}
        uses: actions/download-artifact@v4
        with:
          name: core-v4-catalogo
          path: .
      - name: Preparar catalogo.json ao executar este workflow individualmente
        if: ${{ inputs.encadeado != true }}
        env:
          VITRINE_API_URL: ${{ vars.VITRINE_API_URL }}
        run: |
          test -n "$VITRINE_API_URL" || { echo '::error::Configure VITRINE_API_URL'; exit 1; }
          python -u scripts/sinc-data.py
      - name: Gerar XML e CSV
        run: |
          test -s catalogo.json || { echo '::error::Catálogo V4 ausente'; exit 1; }
          python -u scripts/make-feed-merchantcenter.py
      - name: Disponibilizar resultado para download no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: core-v4-merchant
          path: |
            merchant-produtos.xml
            google-ads-imoveis.csv
          if-no-files-found: error
          retention-days: 3
