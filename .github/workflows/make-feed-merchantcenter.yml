name: 02 make-feed-merchantcenter - XML Google + Meta

# V9.4: motor unico. Uma execucao gera Merchant e Marketplace a partir do mesmo catalogo.
# Nao existe workflow ou job separado para o Marketplace.

'on':
  workflow_call:
    inputs:
      encadeado:
        type: boolean
        default: false
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gerar:
    name: 02 - XML Merchant Center + Marketplace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código do Git
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Receber catalogo.json produzido pelo sinc-data do Core
        if: ${{ inputs.encadeado == true }}
        uses: actions/download-artifact@v4
        with:
          name: core-v4-catalogo
          path: .
      - name: Preparar catalogo.json ao executar este workflow individualmente
        if: ${{ inputs.encadeado != true }}
        env:
          VITRINE_API_URL: ${{ vars.VITRINE_API_URL }}
        run: |
          test -n "$VITRINE_API_URL" || { echo '::error::Configure VITRINE_API_URL'; exit 1; }
          python -u scripts/sinc-data.py
      - name: Gerar XML Merchant (Google) e XML Marketplace (Meta) - motor unificado
        run: |
          test -s catalogo.json || { echo '::error::Catálogo V4 ausente'; exit 1; }
          python -u scripts/make-feed-merchantcenter.py
      - name: Validar contrato dos dois feeds
        run: python -u scripts/validate_xml_v94.py --check feeds
      - name: Disponibilizar os dois feeds para o Core
        uses: actions/upload-artifact@v4
        with:
          name: core-v4-feeds
          path: |
            merchant-produtos.xml
            marketplace-produtos.xml
            google-ads-imoveis.csv
            marketplace-relatorio.json
          if-no-files-found: error
          retention-days: 3
      - name: Confirmar arquivos incluidos no artefato core-v4-feeds
        run: |
          for f in merchant-produtos.xml marketplace-produtos.xml google-ads-imoveis.csv marketplace-relatorio.json; do
            echo "[feeds V9.4] ARTEFATO core-v4-feeds inclui $f ($(wc -c < "$f") bytes)"
          done
