name: Core Imobiliario - Sincronizar e Publicar

# Operação exclusivamente pela aba Actions: cada motor tem seu próprio workflow.
# O Core executa os quatro em sequência e publica o site completo no GitHub Pages.
'on':
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '17 7 * * *'

concurrency:
  group: core-imobiliario-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sinc_data:
    name: 1/4 sinc-data
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/sinc-data.yml
    permissions:
      contents: read

  merchant:
    name: 2/4 make-feed-merchantcenter
    needs: sinc_data
    uses: ./.github/workflows/make-feed-merchantcenter.yml
    with:
      encadeado: true
    permissions:
      contents: read

  sitemap:
    name: 3/4 make-sitemap
    needs: merchant
    uses: ./.github/workflows/make-sitemap.yml
    with:
      encadeado: true
    permissions:
      contents: read

  subpage:
    name: 4/4 make-subpage
    needs: sitemap
    uses: ./.github/workflows/make-subpage.yml
    with:
      encadeado: true
    permissions:
      contents: read

  preparar:
    name: 5 - Validar e montar site para Pages
    needs: subpage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Ler arquivos do Git
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Auditar cinco workflows e botões Run workflow
        run: python -u scripts/auditar_workflows_v425.py
      - name: Verificar workflows antigos
        run: python -u scripts/check_workflows_v423.py
      - name: Receber catálogo
        uses: actions/download-artifact@v4
        with:
          name: core-v4-catalogo
          path: .
      - name: Receber XML Merchant Center
        uses: actions/download-artifact@v4
        with:
          name: core-v4-merchant
          path: .
      - name: Receber sitemap
        uses: actions/download-artifact@v4
        with:
          name: core-v4-sitemap
          path: .
      - name: Receber páginas individuais
        uses: actions/download-artifact@v4
        with:
          name: core-v4-subpages
          path: .
      - name: Restaurar subpáginas do artefato
        run: |
          test -s subpaginas-v4.tar.gz || { echo '::error::Arquivo de subpáginas ausente'; exit 1; }
          tar -xzf subpaginas-v4.tar.gz
          rm subpaginas-v4.tar.gz
      - name: Validar catálogo, filtros, feed, sitemap e HTMLs
        run: |
          python -u scripts/validate_portal_v420.py
          node --check app.js
          node scripts/test_vitrine_catalogo_v420.js
      - name: Montar e conferir o site final
        run: |
          python -u scripts/stage_pages_v421.py
          python -u scripts/validate_pages_v421.py
          python -u scripts/summary_v421.py
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato do site para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    name: 6 - Publicar o site no GitHub Pages
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar artefato completo
        id: deploy
        uses: actions/deploy-pages@v4
