name: 01 sinc-data - Catalogo JSON

'on':
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gerar_catalogo:
    name: 01 - Gerar catalogo.json
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código do Git
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Consultar API pública e criar catálogo completo
        env:
          VITRINE_API_URL: ${{ vars.VITRINE_API_URL }}
        run: |
          test -n "$VITRINE_API_URL" || { echo '::error::Defina VITRINE_API_URL nas variáveis do repositório'; exit 1; }
          python -u scripts/sinc-data.py
      - name: Disponibilizar catalogo.json para os próximos workflows
        uses: actions/upload-artifact@v4
        with:
          name: core-v4-catalogo
          path: catalogo.json
          if-no-files-found: error
          retention-days: 3
