
name: Atualizar sitemap MCMV-RS

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: atualizar-sitemap
  cancel-in-progress: false

jobs:
  gerar-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar sitemap
        run: python scripts/generate_sitemap.py

      - name: Publicar sitemap atualizado
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap sem alteracoes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml
          git commit -m "Atualizar sitemap automaticamente"
          git push
