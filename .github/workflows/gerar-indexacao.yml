name: Gerar sitemap, llms e catalogo

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_discovery.py'
      - 'scripts/validate_discovery.js'
      - '.github/workflows/gerar-indexacao.yml'

permissions:
  contents: write

concurrency:
  group: mcmv-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gerar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar arquivos via API
        env:
          VITRINE_API_URL: ${{ vars.VITRINE_API_URL }}
        run: python scripts/generate_discovery.py
      - name: Validar arquivos
        run: node scripts/validate_discovery.js
      - name: Commit somente se houver alteracoes
        run: |
          git add sitemap.xml llms.txt catalogo.json robots.txt google-ads-imoveis.csv merchant-produtos.xml
          if git diff --cached --quiet; then
            echo 'Sem alteracoes.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Atualiza descoberta MCMV-RS'
          git push
